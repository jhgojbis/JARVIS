<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAME__</title>
<style>
body{margin:0;background:#0b1220;color:#d6f3ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
#log{flex:1;overflow:auto;padding:16px}.m{margin:8px 0;max-width:80%;padding:10px 14px;border-radius:14px}
.u{background:#1c3a5e;margin-left:auto}.a{background:#13283f;border:1px solid #2a6f97}
#bar{display:flex;gap:8px;padding:12px}input{flex:1;padding:12px;border-radius:10px;border:0;background:#13283f;color:#fff}
button{padding:12px 16px;border:0;border-radius:10px;background:#2a9df4;color:#fff;font-size:16px}
#mic.on{background:#e5484d}
</style></head><body>
<div id="log"></div>
<div id="bar"><button id="mic">🎤</button><input id="t" placeholder="Talk or type to __NAME__…"><button id="send">Send</button></div>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),mic=document.getElementById('mic');
let token=localStorage.jt||(localStorage.jt=prompt('Chat token (JARVIS_CHAT_TOKEN)')||'');
function add(c,x){const d=document.createElement('div');d.className='m '+c;d.textContent=x;log.appendChild(d);log.scrollTop=1e9}
function speak(x){const u=new SpeechSynthesisUtterance(x);const vs=speechSynthesis.getVoices();
 u.voice=vs.find(v=>/en-GB/.test(v.lang)&&/male|daniel|brian|george/i.test(v.name))||vs.find(v=>/en-GB/.test(v.lang))||null;speechSynthesis.speak(u)}
async function send(x){if(!x.trim())return;add('u',x);t.value='';
 const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:x,token})});
 if(r.status==401){localStorage.removeItem('jt');add('a','Wrong token - reload.');return}
 const j=await r.json();add('a',j.reply);speak(j.reply)}
document.getElementById('send').onclick=()=>send(t.value);t.onkeydown=e=>{if(e.key=='Enter')send(t.value)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)mic.style.display='none';else{const r=new SR();r.lang='en-GB';r.onresult=e=>send(e.results[0][0].transcript);
 r.onend=()=>mic.classList.remove('on');mic.onclick=()=>{speechSynthesis.cancel();mic.classList.add('on');r.start()}}
</script></body></html>
